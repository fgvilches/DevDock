name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend (tsc + vite)
        run: npm run build

      - name: Run backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build release bundle and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'DevDock v__VERSION__'
          releaseBody: 'See the assets to download and install this version. Build: `DevDock_<version>_aarch64.dmg` (Apple Silicon).'
          releaseDraft: false
          prerelease: false
