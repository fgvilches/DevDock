[package]
name = "devdock"
version = "0.1.0"
description = "DevDock - project dashboard"
authors = ["shift"]
edition = "2024"

[lib]
name = "devdock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
window-vibrancy = "0.5"
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "sync", "time"] }
dirs = "5"
chrono = "0.4"
walkdir = "2"
regex = "1"
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
